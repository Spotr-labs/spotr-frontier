[package]
name = "spotr_markets"
version = "0.1.0"
description = "SPOTR Markets on-chain session and round engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spotr_markets"

[features]
default = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ['cfg(target_os, values("solana"))']
